spring:
  application:
    name: user-service
  config:
    import: classpath:cmm-log-messages.yml
  datasource:
    url: jdbc:mysql://localhost:3306/petstore?useSSL=false&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

mybatis:
  type-aliases-package: com.example.petstore.user.entity
  mapper-locations: "classpath:mapper/*.xml"
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8081

logging:
  structured:
    format:
      console: logstash      # コンソール出力を JSON 化
      # file: logstash   # ファイル出力も JSON 化する場合
    json:
      # 不要なデフォルトフィールドを削除（例: level_value や @version を非表示に）
      exclude:
        - "level_value"
        - "@version"
        - "logger_name"
        - "thread_name"
        - "tags"
  # file:
  #   name: logs/application.log
  level:
    com.example.petstore.user: DEBUG
    org.mybatis: DEBUG

jwt:
  # HS256 署名用の秘密鍵（32 バイト = 256 ビット以上必須）。本番では必ず環境変数で上書きしてください。
  secret: "${JWT_SECRET:petstore-demo-secret-key-change-me-in-production-0123456789abcdef}"
  # トークンの有効期限
  expiration: 1h