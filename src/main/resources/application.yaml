spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/petstore?useSSL=false&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  config:
    import: classpath:log-messages.yml

mybatis:
  type-aliases-package: com.example.petstore.user.entity
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8081
  servlet:
    context-path: /api/v1

logging:
  level:
    com.example.petstore.user: DEBUG
    org.mybatis: DEBUG